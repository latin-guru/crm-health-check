[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "crm-health-check"
version = "0.1.0"
description = "HubSpot-style CRM audit: data hygiene checks, pipeline and attribution reporting, and CRM-vs-billing ARR reconciliation on fictional data."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Kevin Gaviria" }]
license = "LicenseRef-Showcase-View-Only"
license-files = ["LICENSE"]
dependencies = [
    "duckdb==1.5.6",
    "jinja2==3.1.6",
    "pyyaml==6.0.3",
    "typer==0.27.3",
]

[project.optional-dependencies]
dev = [
    "playwright==1.56.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.0",
]

[project.scripts]
chc = "chc.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=chc --cov-report=term-missing"

[tool.coverage.run]
source = ["chc"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI options as argument defaults; that's its documented style.
extend-immutable-calls = ["typer.Option"]
